[project]
name = "polyquant-pro"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
 "psycopg[binary]>=3.2,<4", "websockets>=14,<17","polars>=1.15,<2","httpx[socks]>=0.27,<1","python-socks[asyncio]>=2.7,<3",
 "duckdb>=1.2,<2","numpy>=1.26,<3","scipy>=1.12,<2","pydantic>=2.9,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10","ruff>=0.11,<1","mypy>=1.14,<2"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 115
target-version = "py311"
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
